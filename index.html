<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bundesliga Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        <img src="img/i.png" alt="Bundesliga" class="brand-logo-img" />
        <p class="brand-sub">Tracker</p>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>All Teams</span>
        </div>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-label">Overview</p>
        <div class="stats-bar" id="stats-bar">
          <span id="stats-text">Loading...</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-label">Sort by</p>
        <select id="sort-select" class="sort-select" aria-label="Sort field">
          <option value="id">Default</option>
          <option value="name">Name</option>
          <option value="city">City</option>
          <option value="founded">Founded</option>
        </select>
        <select id="order-select" class="sort-select" aria-label="Sort direction">
          <option value="asc">↑ Ascending</option>
          <option value="desc">↓ Descending</option>
        </select>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-primary" id="btn-add-team">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Team
        </button>
      </div>

    </aside>

    <!-- MAIN -->
    <div class="main-wrap">

      <div class="topbar">
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m17 17 4 4"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search teams..." />
        </div>
        <button type="button" class="btn btn-outline" id="btn-export-csv">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>

      <main class="main-content">
        <div class="teams-grid" id="teams-grid"></div>
        <div class="pagination" id="pagination"></div>
      </main>

    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" id="modal">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <h2 class="modal-title" id="modal-title">Add Team</h2>
      <div class="form-error" id="form-error"></div>
      <div class="form-group">
        <label class="form-label">Team Name *</label>
        <input type="text" id="field-name" class="form-input" placeholder="e.g. Bayern München" />
        <span class="field-error" id="err-name"></span>
      </div>
      <div class="form-group">
        <label class="form-label">City *</label>
        <input type="text" id="field-city" class="form-input" placeholder="e.g. München" />
        <span class="field-error" id="err-city"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Stadium *</label>
        <input type="text" id="field-stadium" class="form-input" placeholder="e.g. Allianz Arena" />
        <span class="field-error" id="err-stadium"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Founded *</label>
        <input type="number" id="field-founded" class="form-input" placeholder="e.g. 1900" min="1800" max="2024" />
        <span class="field-error" id="err-founded"></span>
      </div>
      <div class="form-group">
        <label class="form-label">Shield / Logo URL</label>
        <input type="url" id="field-image" class="form-input" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save">Save Team</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-overlay" aria-hidden="true">
    <div class="modal modal-sm">
      <h2 class="modal-title">Delete Team?</h2>
      <p class="modal-body-text">This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-delete-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="btn-delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
